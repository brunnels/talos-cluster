      direwolf-operator:
        containers:
          operator:
            image:
              repository: ghcr.io/axolotlite/operator
              tag: main@sha256:3b3a409924e99a89e3ee559a095901cbc727cbb48e6e3a1da8574ffcb323e168
      moonlight-proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/axolotlite/moonlight-proxy
              tag: main@sha256:7ea03708590d571fb74744d03245eb5f723cc72a0ae7a3a6c8b5f176400e01d2
