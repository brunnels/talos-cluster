---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app direwolf-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      direwolf-operator:
        containers:
          operator:
            image:
              repository: ghcr.io/axolotlite/operator
              tag: main@sha256:63977c94b23ae9af00fc26c7ea4d01dd6f2908485f43edeec710c96274572c97
      moonlight-proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/axolotlite/moonlight-proxy
              tag: main@sha256:dc841f67443827c05af37ce352d884d5c5958add997a41255e19e44d87976116
