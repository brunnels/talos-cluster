---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app direwolf-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      direwolf-operator:
        containers:
          operator:
            image:
              repository: ghcr.io/brunnels/operator
              tag: main@sha256:8a7eabd9ce8c9671d79e73c876b87381048c45701cc75269349e565e3006625f
      moonlight-proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/brunnels/moonlight-proxy
              tag: main@sha256:d3defd64016f05ea1e44e10bf69ba5c17cb1de5c9297d5e881b7527e44f61a4d
