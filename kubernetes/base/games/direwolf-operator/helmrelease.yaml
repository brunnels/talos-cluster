      moonlight-proxy:
        containers:
          proxy:
            image:
              repository: ghcr.io/brunnels/moonlight-proxy
              tag: main@sha256:d3defd64016f05ea1e44e10bf69ba5c17cb1de5c9297d5e881b7527e44f61a4d
